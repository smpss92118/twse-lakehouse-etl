# Trino reads the same Iceberg tables the pipeline writes: same JDBC catalog, same S3 bucket.
connector.name=iceberg
iceberg.catalog.type=jdbc
iceberg.jdbc-catalog.catalog-name=twse
iceberg.jdbc-catalog.driver-class=org.postgresql.Driver
iceberg.jdbc-catalog.connection-url=jdbc:postgresql://iceberg-catalog-db:5432/iceberg
iceberg.jdbc-catalog.connection-user=iceberg
iceberg.jdbc-catalog.connection-password=iceberg
iceberg.jdbc-catalog.default-warehouse-dir=s3://warehouse
fs.native-s3.enabled=true
s3.endpoint=http://object-store:8333
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=local-dev
s3.aws-secret-key=local-dev
