name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  unit-tests:
    name: Cleaning logic unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Unit + end-to-end tests (recorded TWSE payloads, no network)
        run: uv run pytest -v

  dag-integrity:
    name: DAG imports and has no cycles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the production Airflow image
        run: docker build -f docker/Dockerfile -t twse-airflow:ci .
      - name: DagBag import + cycle check inside that image
        run: >
          docker run --rm -v "$PWD":/repo -w /repo -e PYTHONPATH=/repo/src twse-airflow:ci
          bash -c "pip install -q pytest && python -m pytest -v -o addopts='' -m airflow tests/test_dag_integrity.py"
